<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161b22">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>A股每日资讯</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text2: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d29922;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
    width: 100%;
    max-width: 1280px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }
  .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
  .header {
    text-align: center;
    padding: 20px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .subtitle { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 12px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
    flex: 0 0 auto;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .snapshot {
    background: linear-gradient(135deg, #1a2332, #161b22);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .snapshot::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--red), var(--orange), var(--green));
  }
  .snapshot-title {
    font-size: 14px; font-weight: 600; color: var(--accent);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .snapshot-date { font-size: 11px; color: var(--text2); font-weight: 400; margin-left: auto; }
  .emotion-hero {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 14px 10px; margin-bottom: 12px;
    background: linear-gradient(135deg, rgba(88,166,255,.12), rgba(188,140,255,.08));
    border: 1px solid rgba(88,166,255,.25);
    border-radius: 10px;
  }
  .emotion-num {
    font-size: 42px; font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .emotion-num small { font-size: 16px; -webkit-text-fill-color: var(--text2); color: var(--text2); }
  .emotion-text { font-size: 15px; font-weight: 700; }
  .emotion-level {
    display: inline-block; margin-top: 4px;
    padding: 2px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 600;
  }
  .emotion-level.hot { background: rgba(248,81,73,.15); color: var(--red); }
  .emotion-level.neutral { background: rgba(210,153,34,.15); color: var(--orange); }
  .emotion-level.cold { background: rgba(63,185,80,.15); color: var(--green); }
  .snapshot-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 12px;
  }
  .snap-item {
    text-align: center; padding: 8px 4px;
    background: rgba(255,255,255,.03); border-radius: 6px;
    border: 1px solid rgba(255,255,255,.05);
  }
  .snap-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .snap-value { font-size: 15px; font-weight: 700; }
  .snap-up { color: var(--red); }
  .snap-down { color: var(--green); }
  .snap-neutral { color: var(--orange); }
  .snapshot-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .snap-tag {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    background: rgba(88,166,255,.1); color: var(--accent);
    border: 1px solid rgba(88,166,255,.2);
  }
  .snap-tag.hot { background: rgba(248,81,73,.1); color: var(--red); border-color: rgba(248,81,73,.2); }
  .snapshot-judge {
    font-size: 12px; color: var(--text); line-height: 1.6;
    padding: 8px 10px; margin-top: 10px;
    background: rgba(255,255,255,.03);
    border-left: 3px solid var(--orange);
    border-radius: 0 6px 6px 0;
  }
  .snapshot-judge:empty { display: none; }
  .snapshot-judge b { color: var(--orange); }
  .snapshot-link-row { margin-top: 10px; text-align: center; }
  .snapshot-link-row a {
    display: inline-block; padding: 7px 16px;
    background: rgba(88,166,255,.12); color: var(--accent);
    border: 1px solid rgba(88,166,255,.3); border-radius: 18px;
    font-size: 12px; font-weight: 600; text-decoration: none;
  }
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 15px; font-weight: 600; color: var(--accent);
    margin-bottom: 10px; padding-left: 8px;
    border-left: 3px solid var(--accent);
  }
  .quick-scroll {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
    -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain; scrollbar-width: none;
  }
  .quick-scroll::-webkit-scrollbar { display: none; }
  .quick-card {
    flex: 0 0 auto; min-width: min(82vw, 290px);
    scroll-snap-align: start; padding: 10px 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  }
  .quick-card.active { border-color: rgba(88,166,255,.7); background: rgba(88,166,255,.05); }
  .quick-card .qc-date { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .quick-card .qc-summary { font-size: 11px; color: var(--text2); line-height: 1.45; min-height: 32px; }
  .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
  .quick-btn {
    min-height: 40px; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 7px 6px; border-radius: 6px;
    border: 1px solid var(--border); color: var(--text); text-decoration: none;
    font-size: 11px; background: rgba(255,255,255,.025);
  }
  .quick-btn:hover { border-color: var(--accent); background: rgba(88,166,255,.08); }
  .quick-btn.disabled { opacity: .35; pointer-events: none; }
  .focus-list { display: flex; flex-direction: column; gap: 6px; }
  .focus-item {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; color: var(--text); line-height: 1.5;
    padding: 6px 10px; background: rgba(255,255,255,.03);
    border-radius: 6px; border-left: 2px solid var(--accent);
  }
  .focus-item .f-num {
    flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(88,166,255,.15); color: var(--accent);
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .discipline-strip {
    display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto;
    padding-bottom: 4px; -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity; scrollbar-width: none;
    font-size: 12px; color: var(--text);
  }
  .discipline-strip::-webkit-scrollbar { display: none; }
  .discipline-strip span {
    flex: 0 0 auto; scroll-snap-align: start;
    padding: 6px 10px; border-radius: 6px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
  }
  .date-group {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; margin: 4px 0;
  }
  .date-header {
    background: rgba(88,166,255,.06); padding: 6px 10px;
    font-size: 13px; font-weight: 600; color: var(--accent);
    display: flex; align-items: center; gap: 6px;
  }
  .date-header .weekday { font-size: 11px; color: var(--text2); font-weight: 400; }
  .report-links { display: grid; grid-template-columns: repeat(3, 1fr); }
  .report-link {
    min-height: 48px; display: flex; align-items: center; justify-content: center;
    padding: 8px 4px; text-decoration: none; color: var(--text);
    font-size: 12px; text-align: center; border-right: 1px solid var(--border);
  }
  .report-link:last-child { border-right: none; }
  .report-link:hover { background: rgba(88,166,255,.08); }
  .report-link.disabled { color: var(--text2); opacity: .4; pointer-events: none; }
  .report-link .time { font-size: 10px; color: var(--text2); display: block; margin-top: 1px; }
  .week-days { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 8px; }
  .footer {
    text-align: center; padding: 16px 0; font-size: 11px;
    color: var(--text2); border-top: 1px solid var(--border); margin-top: 20px;
  }
  .footer .schedule-inline { margin-bottom: 6px; color: var(--text); }

  @media (min-width: 720px) {
    body { padding: 20px; padding-bottom: 88px; }
    .header h1 { font-size: 24px; }
    .snapshot { padding: 18px; }
    .emotion-num { font-size: 46px; }
  }
  @media (min-width: 960px) {
    body { padding: 24px 28px 96px; }
    .header { padding-top: 14px; margin-bottom: 14px; }
    .header h1 { font-size: 26px; }
    .dashboard-grid {
      grid-template-columns: minmax(0, 1.45fr) minmax(340px, .75fr);
      column-gap: 20px; row-gap: 14px; align-items: start;
    }
    .snapshot { grid-column: 1; grid-row: 1 / span 3; margin-bottom: 0; }
    .recent-section { grid-column: 2; grid-row: 1; margin-bottom: 0; }
    .focus-section { grid-column: 2; grid-row: 2; margin-bottom: 0; }
    .quotes-section { grid-column: 2; grid-row: 3; margin-bottom: 0; }
    .history-section { grid-column: 1 / -1; margin-top: 4px; }
    .quick-scroll { flex-direction: column; overflow: visible; padding-bottom: 0; }
    .quick-card { width: 100%; min-width: 0; }
    .discipline-strip { flex-wrap: wrap; overflow: visible; padding-bottom: 0; }
    .week-days { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  }
  @media (max-width: 719px) {
    .status-bar { justify-content: center; text-align: center; flex-wrap: wrap; }
    .status-bar > span:last-child { width: 100%; margin-left: 0 !important; }
    .snapshot-title { justify-content: center; }
    .snapshot-date { margin-left: 0; }
    .emotion-hero { justify-content: center; padding-left: 0; }
    .snapshot-tags { justify-content: center; }
    .snapshot-judge { text-align: center; }
    .section-title { text-align: center; padding-left: 0; border-left: none; }
    .quick-card { text-align: center; }
    .quick-card .qc-date, .quick-card .qc-summary { text-align: center; }
    .focus-item { justify-content: center; }
    .discipline-strip { flex-wrap: wrap; justify-content: center; overflow-x: visible; }
    .date-header { justify-content: center; }
  }
  @media (max-width: 350px) {
    .snapshot-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1200px) {
    body { padding-left: 32px; padding-right: 32px; }
    .dashboard-grid { grid-template-columns: minmax(0, 1.6fr) minmax(360px, .8fr); column-gap: 24px; }
    .snapshot { padding: 22px; }
    .emotion-hero { min-height: 112px; }
    .emotion-num { font-size: 50px; }
    .week-days { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

/* 搜索框 */
.search-wrap{margin-bottom:10px}
.search-wrap input{width:100%;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text2)}
/* 主题切换 */
.theme-toggle{position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:999;transition:all .3s}
.theme-toggle:hover{border-color:var(--accent);background:rgba(88,166,255,.1)}
/* 相对时间 */
.rel-time{font-size:11px;color:var(--text2);margin-left:6px}

/* 亮色主题 */
[data-theme="light"]{
  --bg:#ffffff;--card:#f6f8fa;--border:#d0d7de;--text:#1f2328;--text2:#656d76;
  --accent:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#9a6700;--purple:#8250df;
}
[data-theme="light"] .snapshot{background:linear-gradient(135deg,#f0f4ff,#f6f8fa)}
[data-theme="light"] .theme-toggle{background:#f6f8fa;border-color:#d0d7de}
[data-theme="light"] .search-wrap input{background:#f6f8fa;border-color:#d0d7de;color:#1f2328}
</style>
</head>
<body>
<div class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">🌙</div>

<div class="header">
  <h1>📊 A股每日资讯</h1>
  <div class="subtitle" id="header-subtitle">加载中...</div>
</div>
<div class="status-bar">
  <div class="status-dot"></div>
  <span>系统正常</span>
  <span style="margin-left:auto" id="next-report">🕐 加载中</span>
</div>
<main class="dashboard-grid">
  <div class="snapshot" id="snapshot-section">
    <!-- 骨架屏 -->
    <div class="sk-wrap">
      <div class="sk-snap"><div class="sk-block sk-circle"></div><div class="sk-col"><div class="sk-block sk-line w60"></div><div class="sk-block sk-line w40"></div></div></div>
      <div class="sk-row"><div class="sk-block sk-card"></div><div class="sk-block sk-card"></div><div class="sk-block sk-card"></div></div>
      <div class="sk-block sk-line w80"></div>
      <div class="sk-block sk-line w60"></div>
    </div>
  </div>
  <div class="section recent-section">
    <div class="section-title">📋 最近报告</div>
    <div class="quick-scroll" id="recent-reports">
      <div style="display:flex;gap:8px;flex-shrink:0"><div class="sk-block" style="width:260px;height:110px;border-radius:8px"></div><div class="sk-block" style="width:260px;height:110px;border-radius:8px"></div></div>
    </div>
  </div>
  <div class="section focus-section">
    <div class="section-title" id="focus-title">🎯 今日关注</div>
    <div class="focus-list" id="focus-list">
      <div class="sk-block sk-line w80" style="height:32px;margin-bottom:6px;border-radius:6px"></div>
      <div class="sk-block sk-line w60" style="height:32px;margin-bottom:6px;border-radius:6px"></div>
      <div class="sk-block sk-line w80" style="height:32px;border-radius:6px"></div>
    </div>
  </div>
  <div class="section quotes-section">
    <div class="section-title">⚡ 短线交易语录</div>
    <div class="discipline-strip">
      <span>只做最强，不做跟风</span>
      <span>买在分歧，卖在一致</span>
      <span>看不懂就空仓，做错就止损</span>
      <span>宁可错过，不可做错</span>
      <span>计划交易，交易计划</span>
    </div>
  </div>
  <div class="section history-section">
    <div class="search-wrap"><input type="text" id="history-search" placeholder="🔍 搜索日期，如 8/24、周一..." oninput="filterHistory()"></div>
<div class="section-title">📅 历史报告</div>
    <div id="history-section">
      <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:8px">
        <div class="sk-block" style="height:42px;border-radius:0"></div>
        <div style="padding:8px"><div class="sk-block sk-date"></div><div class="sk-block sk-links"></div></div>
      </div>
      <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <div class="sk-block" style="height:42px;border-radius:0"></div>
        <div style="padding:8px"><div class="sk-block sk-date"></div><div class="sk-block sk-links"></div></div>
      </div>
    </div>
  </div>
</main>
<div class="footer" id="footer-section">
  <div class="schedule-inline">自动报告 · 08:00 盘前 · 12:00 午盘 · 20:30 盘后</div>
  A股每日资讯 · AI 自动生成 · 仅供参考，不构成投资建议
</div>

<script>
// ===== 数据驱动渲染 =====
function loadRetry() {
  document.getElementById('header-subtitle').textContent = '加载中...';
  fetch('./reports-data.json?t=' + Date.now())
    .then(r => r.json())
    .then(D => render(D))
    .catch(() => {
      document.getElementById('header-subtitle').textContent = '数据加载失败';
      showRetry();
    });
}
function showRetry() {
  ['snapshot-section','recent-reports','focus-list','history-section'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text2);font-size:13px">数据加载失败</div>';
  });
  const retryEl = document.createElement('div');
  retryEl.style.cssText = 'text-align:center;padding:8px 0 16px';
  retryEl.innerHTML = '<button class="retry-btn" onclick="loadRetry()">🔄 重新加载</button>';
  const grid = document.querySelector('.dashboard-grid');
  if (grid && !grid.querySelector('.retry-btn')) grid.parentNode.insertBefore(retryEl, grid.nextSibling);
}
loadRetry();

// 自动刷新：2分钟
setInterval(() => {
  fetch('./reports-data.json?t=' + Date.now())
    .then(r => r.json())
    .then(D => render(D))
    .catch(() => {});
}, 120000);

// 切回页面刷新
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    fetch('./reports-data.json?t=' + Date.now())
      .then(r => r.json())
      .then(D => render(D))
      .catch(() => {});
  }
});

function calcNextReport() {
  const now = new Date();
  const day = now.getDay(); // 0=Sun, 6=Sat
  const t = now.getHours() * 60 + now.getMinutes();

  // 周末：下次报告是下周一 08:00
  if (day === 0 || day === 6) {
    const daysUntilMon = day === 6 ? 2 : 1;
    const d = new Date(now);
    d.setDate(d.getDate() + daysUntilMon);
    return { time: (d.getMonth()+1) + '/' + d.getDate() + ' 08:00', label: '盘前（周一）' };
  }

  // 工作日：根据当前时间判断
  if (t < 8 * 60) return { time: '08:00', label: '盘前' };
  if (t < 12 * 60) return { time: '12:00', label: '午盘' };
  if (t < 20 * 60 + 30) return { time: '20:30', label: '盘后' };

  // 今日报告全部结束
  if (day === 5) {
    // 周五 → 下周一
    const d = new Date(now);
    d.setDate(d.getDate() + 3);
    return { time: (d.getMonth()+1) + '/' + d.getDate() + ' 08:00', label: '盘前（周一）' };
  }
  // 周一至周四 → 明天 08:00
  const d = new Date(now);
  d.setDate(d.getDate() + 1);
  return { time: (d.getMonth()+1) + '/' + d.getDate() + ' 08:00', label: '盘前' };
}

function render(D) {
  // Header
  document.getElementById('header-subtitle').textContent = D.header.subtitle;

  // Status bar — 动态计算下次报告时间
  const next = calcNextReport();
  document.getElementById('next-report').textContent = '🕐 下次报告 ' + next.time + ' ' + next.label;

  // Snapshot
  renderSnapshot(D.snapshot);

  // Recent reports
  renderRecent(D.reports);

  // Focus
  renderFocus(D.focus);

  // History
  renderHistory(D.history);

  // Footer
  const footer = document.getElementById('footer-section');
  footer.innerHTML = '<div class="schedule-inline">' + (D.footer.schedule || '自动报告 · 08:00 盘前 · 12:00 午盘 · 20:30 盘后') + '</div>'
    + 'A股每日资讯 · AI 自动生成 · 仅供参考，不构成投资建议<br>'
    + '页面更新：' + (D.footer.updated || '') + ' <span class="rel-time">(' + relativeTime(D.footer.updated) + ')</span>';
}

function renderSnapshot(S) {
  if (!S) return;
  const el = document.getElementById('snapshot-section');
  let metricsHtml = '';
  (S.metrics || []).forEach(m => {
    let val = m.html || ('<span class="' + (m.cls||'') + '">' + m.value + (m.suffix ? ' <small>' + m.suffix + '</small>' : '') + '</span>');
    metricsHtml += '<div class="snap-item"><div class="snap-label">' + m.label + '</div><div class="snap-value">' + val + '</div></div>';
  });
  let tagsHtml = '';
  (S.tags || []).forEach(t => {
    tagsHtml += '<span class="snap-tag' + (t.cls ? ' ' + t.cls : '') + '">' + t.text + '</span>';
  });
  const linkUrl = S.latestLink || '#';
  const linkLabel = S.latestLabel || '完整报告';
  el.innerHTML = '<div class="snapshot-title">⚡ 最新速览<span class="snapshot-date">' + (S.date||'') + ' <span class="rel-time">(' + relativeTime(S.date) + ')</span></span></div>'
    + '<div class="emotion-hero"><div class="emotion-num">' + (S.emotion.score||'--') + '<small>/100</small></div>'
    + '<div class="emotion-text">情绪温度<div><span class="emotion-level ' + (S.emotion.levelClass||'neutral') + '">' + (S.emotion.level||'') + '</span></div></div></div>'
    + '<div class="snapshot-grid">' + metricsHtml + '</div>'
    + '<div class="snapshot-tags">' + tagsHtml + '</div>'
    + (S.judge ? '<div class="snapshot-judge"><b>市场判断：</b>' + S.judge + '</div>' : '')
    + '<div class="snapshot-link-row"><a href="' + linkUrl + '">查看' + linkLabel + '完整报告 →</a></div>';
}

function renderRecent(reports) {
  if (!reports) return;
  const el = document.getElementById('recent-reports');
  let html = '';
  reports.forEach(r => {
    const active = r.active ? ' active' : '';
    const mBtn = (r.morning && r.morning !== 'pending') ? '<a class="quick-btn" href="' + r.morning + '">🌅 盘前</a>' : '';
    const nBtn = (r.noon && r.noon !== 'pending') ? '<a class="quick-btn" href="' + r.noon + '">☀️ 午盘</a>' : '';
    const eBtn = (r.evening && r.evening !== 'pending') ? '<a class="quick-btn" href="' + r.evening + '">🌙 盘后</a>' : '';
    html += '<div class="quick-card' + active + '"><div class="qc-date">' + r.date + ' ' + r.weekday + '</div>'
      + '<div class="qc-summary">' + (r.summary||'') + '</div>'
      + '<div class="quick-actions">' + mBtn + nBtn + eBtn + '</div></div>';
  });
  el.innerHTML = html;
}

function renderFocus(F) {
  if (!F) return;
  document.getElementById('focus-title').textContent = '🎯 ' + (F.title || '关注');
  const el = document.getElementById('focus-list');
  let html = '';
  (F.items || []).forEach((item, i) => {
    html += '<div class="focus-item"><span class="f-num">' + (i+1) + '</span><span>' + item + '</span></div>';
  });
  el.innerHTML = html || '<div class="focus-item"><span>暂无</span></div>';
}

function renderHistory(weeks) {
  if (!weeks) return;
  const el = document.getElementById('history-section');
  let html = '';
  weeks.forEach(w => {
    const savedOpen = localStorage.getItem('week_open_' + w.weekLabel);
    const isOpen = savedOpen !== null ? savedOpen === '1' : (w.open || false);
    const openAttr = isOpen ? ' open' : '';
    const arrow = isOpen ? '▼' : '▶';
    let daysHtml = '';
    (w.days || []).forEach(d => {
      const todayBadge = d.today ? ' <span class="weekday">(今天)</span>' : ' <span class="weekday">' + d.weekday + '</span>';
      let linksHtml = '';
      (d.reports || []).forEach(r => {
        if (r.url && r.url !== '#') {
          linksHtml += '<a class="report-link" href="' + r.url + '"><div>' + r.icon + '<div class="time">' + (r.time||'') + '</div></div></a>';
        }
      });
      daysHtml += '<div class="date-group"><div class="date-header">📅 ' + d.date + todayBadge + '</div><div class="report-links">' + linksHtml + '</div></div>';
    });
    html += '<details' + openAttr + ' style="margin-bottom:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden">'
      + '<summary style="padding:10px 12px;font-size:14px;font-weight:600;color:var(--accent);cursor:pointer;background:rgba(88,166,255,.04);list-style:none;display:flex;align-items:center;gap:8px;user-select:none">'
      + '<span style="font-size:12px">' + arrow + '</span>📅 ' + w.weekLabel
      + '<span style="margin-left:auto;font-size:11px;color:var(--text2);font-weight:400">' + w.count + '</span></summary>'
      + '<div class="week-days">' + daysHtml + '</div></details>';
  });
  el.innerHTML = html;
  // Add toggle listeners for localStorage
  el.querySelectorAll('details').forEach(det => {
    det.addEventListener('toggle', function() {
      var label = this.querySelector('summary').textContent;
      localStorage.setItem('week_open_' + label.trim(), this.open ? '1' : '0');
    });
  });
}


// 搜索过滤
function filterHistory() {
  var q = document.getElementById('history-search').value.toLowerCase();
  document.querySelectorAll('#history-section .date-group').forEach(function(g) {
    var txt = g.textContent.toLowerCase();
    g.style.display = txt.indexOf(q) >= 0 ? '' : 'none';
  });
  // 自动展开有匹配结果的折叠组
  if (q) {
    document.querySelectorAll('#history-section details').forEach(function(det) {
      var visible = det.querySelectorAll('.date-group:not([style*="display: none"])');
      if (visible.length > 0) det.open = true;
    });
  }
}

// 相对时间
function relativeTime(dateStr) {
  if (!dateStr) return '';
  var d;
  if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
    d = new Date(dateStr + 'T00:00:00+08:00');
  } else {
    d = new Date(dateStr.replace(/\//g, '-'));
    if (isNaN(d)) return dateStr;
  }
  if (isNaN(d)) return dateStr;
  var now = new Date();
  var diff = now - d;
  if (diff < 0) return dateStr;
  var mins = Math.floor(diff / 60000);
  var hours = Math.floor(diff / 3600000);
  var days = Math.floor(diff / 86400000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  if (days < 30) return Math.floor(days/7) + '周前';
  return dateStr;
}

// 主题切换
function toggleTheme() {
  var cur = localStorage.getItem('theme') || 'dark';
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('themeToggle').textContent = next === 'dark' ? '🌙' : '☀️';
}
(function() {
  var saved = localStorage.getItem('theme') || 'dark';
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeToggle').textContent = '☀️';
  }
})();

// PWA 原生安装提示
(function() {
  if (window.matchMedia('(display-mode: standalone)').matches) return;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    setTimeout(function() { e.prompt(); }, 2000);
  });
})();
</script>
