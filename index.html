<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A股资讯">
<link rel="manifest" href="manifest.json">
<title>A股每日资讯</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text2: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d29922;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
    padding: 16px;
    padding-bottom: 80px;
    max-width: 720px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    padding: 20px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .subtitle {
    font-size: 13px;
    color: var(--text2);
    margin-top: 4px;
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 12px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .snapshot {
    background: linear-gradient(135deg, #1a2332, #161b22);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .snapshot::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--red), var(--orange), var(--green));
  }
  .snapshot-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .snapshot-date {
    font-size: 11px;
    color: var(--text2);
    font-weight: 400;
    margin-left: auto;
  }
  .snapshot-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .snap-item {
    text-align: center;
    padding: 8px 4px;
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .snap-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .snap-value { font-size: 15px; font-weight: 700; }
  .snap-up { color: var(--red); }
  .snap-down { color: var(--green); }
  .snap-neutral { color: var(--orange); }
  .snapshot-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .snap-tag {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    background: rgba(88,166,255,0.1); color: var(--accent);
    border: 1px solid rgba(88,166,255,0.2);
  }
  .snap-tag.hot {
    background: rgba(248,81,73,0.1); color: var(--red);
    border-color: rgba(248,81,73,0.2);
  }
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 15px; font-weight: 600; color: var(--accent);
    margin-bottom: 10px; padding-left: 8px;
    border-left: 3px solid var(--accent);
  }
  .quick-scroll {
    display: flex; gap: 8px; overflow-x: auto;
    padding-bottom: 8px; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .quick-scroll::-webkit-scrollbar { display: none; }
  .quick-card {
    flex: 0 0 auto; min-width: 130px; padding: 10px 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; text-decoration: none; color: var(--text);
    transition: border-color 0.15s;
  }
  .quick-card:hover { border-color: var(--accent); }
  .quick-card .qc-date {
    font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 4px;
  }
  .quick-card .qc-info { font-size: 11px; color: var(--text2); line-height: 1.4; }
  .quick-card.active { border-color: var(--accent); background: rgba(88,166,255,0.05); }
  .quick-card.disabled { opacity: 0.4; pointer-events: none; }
  .report-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .date-group {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .date-header {
    background: rgba(88,166,255,0.06); padding: 8px 12px;
    font-size: 14px; font-weight: 600; color: var(--accent);
    display: flex; align-items: center; gap: 6px;
  }
  .date-header .weekday { font-size: 12px; color: var(--text2); font-weight: 400; }
  .report-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .report-link {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 10px 6px; text-decoration: none; color: var(--text);
    font-size: 13px; text-align: center; transition: background 0.15s;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .report-link:last-child { border-right: none; }
  .report-link:hover { background: rgba(88,166,255,0.08); }
  .report-link.disabled { color: var(--text2); opacity: 0.4; pointer-events: none; }
  .report-link .time { font-size: 11px; color: var(--text2); display: block; margin-top: 2px; }
  .quick-links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .quick-link {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    text-decoration: none; color: var(--text); font-size: 13px;
    transition: background 0.15s;
  }
  .quick-link:hover { background: rgba(88,166,255,0.06); border-color: var(--accent); }
  .quick-link .icon { font-size: 16px; }
  .quick-link .name { font-weight: 500; }
  .quick-link .desc { font-size: 11px; color: var(--text2); }
  .footer {
    text-align: center; padding: 16px 0; font-size: 11px;
    color: var(--text2); border-top: 1px solid var(--border); margin-top: 20px;
  }
  .back-top {
    position: fixed; bottom: 24px; right: 24px;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none;
    font-size: 18px; cursor: pointer; opacity: 0;
    transition: opacity 0.2s; display: flex;
    align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 100;
  }
  .back-top.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 A股每日资讯</h1>
  <div class="subtitle">短线复盘 · 盘前/午盘/盘后 · 自动更新</div>
</div>

<div class="status-bar">
  <div class="status-dot"></div>
  <span>系统就绪</span>
  <span style="margin-left:auto">🕐 <span id="updateTime"></span></span>
</div>


<div id="refreshHint" style="display:none;text-align:center;padding:8px;margin-bottom:12px;background:rgba(88,166,255,0.08);border:1px solid rgba(88,166,255,0.2);border-radius:6px;font-size:12px;color:var(--accent)">
  🔄 下拉刷新获取最新报告
</div>

<!-- 今日速览 -->
<div class="snapshot" id="snapshotArea">
  <div class="snapshot-title">
    ⚡ 最新速览
    <span class="snapshot-date" id="snapshotDate"></span>
  </div>
  <div class="snapshot-grid" id="snapshotGrid"></div>
  <div class="snapshot-tags" id="snapshotTags"></div>
</div>

<!-- 最近报告快链 -->
<div class="section">
  <div class="section-title">📋 最近报告</div>
  <div class="quick-scroll" id="quickScroll"></div>
</div>

<!-- 全部报告 -->
<div class="section">
  <div class="section-title">📅 历史报告</div>
  <div class="report-grid" id="reportGrid"></div>
</div>

<!-- 常用数据源 -->
<div class="section">
  <div class="section-title">🔗 常用数据源</div>
  <div class="quick-links">
    <a class="quick-link" href="https://www.cls.cn/" target="_blank">
      <span class="icon">📰</span>
      <div><div class="name">财联社</div><div class="desc">快讯·复盘·电报</div></div>
    </a>
    <a class="quick-link" href="https://www.10jqka.com.cn/" target="_blank">
      <span class="icon">📈</span>
      <div><div class="name">同花顺</div><div class="desc">行情·概念·资金</div></div>
    </a>
    <a class="quick-link" href="https://guba.eastmoney.com/" target="_blank">
      <span class="icon">💬</span>
      <div><div class="name">东方财富股吧</div><div class="desc">情绪·资金·龙虎榜</div></div>
    </a>
    <a class="quick-link" href="https://www.iwencai.com/" target="_blank">
      <span class="icon">🔍</span>
      <div><div class="name">i问财</div><div class="desc">自然语言选股</div></div>
    </a>
    <a class="quick-link" href="https://www.kpl.com/" target="_blank">
      <span class="icon">🎯</span>
      <div><div class="name">开盘啦</div><div class="desc">涨停·封板率·情绪</div></div>
    </a>
    <a class="quick-link" href="https://www.jygc8.com/" target="_blank">
      <span class="icon">🧠</span>
      <div><div class="name">韭研公社</div><div class="desc">题材逻辑·研报</div></div>
    </a>
    <a class="quick-link" href="https://data.eastmoney.com/bkzj/hy.html" target="_blank">
      <span class="icon">💰</span>
      <div><div class="name">东财板块资金</div><div class="desc">主力净流入排名</div></div>
    </a>
    <a class="quick-link" href="https://data.eastmoney.com/stock/lhb.html" target="_blank">
      <span class="icon">🐉</span>
      <div><div class="name">龙虎榜</div><div class="desc">游资·机构席位</div></div>
    </a>
  </div>
</div>

<div class="footer">
  A股每日资讯 · AI 自动生成 · 仅供参考，不构成投资建议<br>
  💡 iPhone Safari: 点"分享"→"添加到主屏幕" 获得App体验
</div>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ============================================================
// 报告数据配置（每次部署时由脚本更新此配置）
// 日期和星期完全由JS自动计算，杜绝手动填写错误
// ============================================================
const REPORT_CONFIG = {
  lastUpdated: "2026-08-22",
  snapshot: {
    dateStr: "8/21",           // MM/D格式
    year: 2026,
    month: 8,                  // 1-12
    day: 21,
    data: {
      shIndex: { value: "3905", change: "+0.04%", up: true },
      cyIndex: { value: "3546", change: "+1.43%", up: true },
      volume: "1.88万亿",
      limitUp: "54",
      limitDown: "14",
      emotion: "48/100",
      sealRate: "75%"
    },
    tags: [
      { text: "🔥 CPO/通信", hot: true },
      { text: "🔥 贵金属", hot: true },
      { text: "💎 锂矿", hot: false },
      { text: "🤖 机器人", hot: false },
      { text: "🔋 固态电池", hot: false }
    ]
  },
  // 报告列表：只需填 date 和每个时段的 file（有报告填文件名，无报告填null）
  // 星期几由JS根据date自动计算，永远不会出错
  reports: [
    {
      date: "2026-08-21",
      morning: null,
      noon: null,
      evening: { file: "report-0821.html", time: "20:30", summary: "情绪48 · 涨停54 · 主线：CPO+贵金属" }
    },
    {
      date: "2026-08-24",
      morning: null,
      noon: null,
      evening: null
    }
  ]
};

// ============================================================
// 自动计算工具函数
// ============================================================
const WEEKDAYS = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

function getWeekday(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return WEEKDAYS[date.getDay()];
}

function formatDateShort(dateStr) {
  const [, m, d] = dateStr.split("-");
  return `${parseInt(m)}/${parseInt(d)}`;
}

function isFuture(dateStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d) > today;
}

function isToday(dateStr) {
  const today = new Date();
  const [y, m, d] = dateStr.split("-").map(Number);
  return y === today.getFullYear() && m === today.getMonth() + 1 && d === today.getDate();
}

// ============================================================
// 渲染页面
// ============================================================
function render() {
  const cfg = REPORT_CONFIG;

  // 更新时间
  document.getElementById("updateTime").textContent = "更新：" + cfg.lastUpdated;

  // 今日速览
  const snap = cfg.snapshot;
  const weekday = getWeekday(`${snap.year}-${String(snap.month).padStart(2,"0")}-${String(snap.day).padStart(2,"0")}`);
  document.getElementById("snapshotDate").textContent = `${snap.dateStr} ${weekday} 收盘`;

  const d = snap.data;
  document.getElementById("snapshotGrid").innerHTML = `
    <div class="snap-item">
      <div class="snap-label">上证</div>
      <div class="snap-value ${d.shIndex.up ? 'snap-up' : 'snap-down'}">${d.shIndex.value} <small>${d.shIndex.change}</small></div>
    </div>
    <div class="snap-item">
      <div class="snap-label">创业板</div>
      <div class="snap-value ${d.cyIndex.up ? 'snap-up' : 'snap-down'}">${d.cyIndex.value} <small>${d.cyIndex.change}</small></div>
    </div>
    <div class="snap-item">
      <div class="snap-label">成交</div>
      <div class="snap-value snap-neutral">${d.volume}</div>
    </div>
    <div class="snap-item">
      <div class="snap-label">涨停/跌停</div>
      <div class="snap-value"><span class="snap-up">${d.limitUp}</span> / <span class="snap-down">${d.limitDown}</span></div>
    </div>
    <div class="snap-item">
      <div class="snap-label">情绪分</div>
      <div class="snap-value snap-neutral">${d.emotion}</div>
    </div>
    <div class="snap-item">
      <div class="snap-label">封板率</div>
      <div class="snap-value snap-up">${d.sealRate}</div>
    </div>
  `;

  document.getElementById("snapshotTags").innerHTML = snap.tags.map(t =>
    `<span class="snap-tag${t.hot ? ' hot' : ''}">${t.text}</span>`
  ).join("");

  // 最近报告快链（最近2条）
  const recentReports = cfg.reports.slice(0, 2);
  let quickHTML = "";
  recentReports.forEach(r => {
    const short = formatDateShort(r.date);
    const wd = getWeekday(r.date);
    const future = isFuture(r.date);
    const active = !future && (r.evening || r.noon || r.morning);
    const href = active ? (r.evening?.file || r.noon?.file || r.morning?.file) : "#";
    const cls = active ? "quick-card active" : "quick-card disabled";

    if (active) {
      const report = r.evening || r.noon || r.morning;
      const sessions = [];
      if (r.morning) sessions.push("🌅 盘前");
      if (r.noon) sessions.push("☀️ 午盘");
      if (r.evening) sessions.push("🌙 盘后");
      quickHTML += `
        <a class="${cls}" href="${href}">
          <div class="qc-date">${short} ${wd}</div>
          <div class="qc-info">${sessions.join(" ")}<br>${report.summary || ""}</div>
        </a>`;
    } else {
      quickHTML += `
        <div class="${cls}">
          <div class="qc-date">${short} ${wd}</div>
          <div class="qc-info">待生成...</div>
        </div>`;
    }
  });
  document.getElementById("quickScroll").innerHTML = quickHTML;

  // 历史报告（按周折叠）
  const sortedReports = [...cfg.reports].sort((a, b) => b.date.localeCompare(a.date));

  // 按周分组
  function getWeekLabel(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    const dayOfYear = Math.floor((date - new Date(y, 0, 0)) / 86400000);
    const weekNum = Math.ceil(dayOfYear / 7);
    return y + " 第" + weekNum + "周";
  }

  // 获取周一日期
  function getMonday(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    const day = date.getDay() || 7;
    const mon = new Date(date);
    mon.setDate(d - day + 1);
    return (mon.getMonth()+1) + "/" + mon.getDate();
  }

  let weeks = {};
  sortedReports.forEach(r => {
    const wk = getWeekLabel(r.date);
    if (!weeks[wk]) weeks[wk] = { label: wk, monday: getMonday(r.date), reports: [] };
    weeks[wk].reports.push(r);
  });

  let gridHTML = "";
  Object.keys(weeks).forEach((wk, idx) => {
    const week = weeks[wk];
    const isOpen = idx === 0; // 第一周默认展开

    let weekContent = "";
    week.reports.forEach(r => {
      const wd = getWeekday(r.date);
      const future = isFuture(r.date);
      const today = isToday(r.date);
      let dateLabel = r.date.slice(5); // MM-DD
      if (today) dateLabel += " (今天)";

      const renderLink = (session, icon, defaultTime) => {
        const data = r[session];
        if (data && data.file) {
          return `<a class="report-link" href="${data.file}" target="_blank">
            <div>${icon}<div class="time">${data.time || defaultTime}</div></div>
          </a>`;
        }
        return `<a class="report-link disabled" href="#">
          <div>${icon}<div class="time">${future ? "待生成" : "—"}</div></div>
        </a>`;
      };

      weekContent += `
        <div class="date-group" style="margin:4px 0">
          <div class="date-header" style="font-size:13px;padding:6px 10px">
            📅 ${dateLabel} <span class="weekday">${wd}</span>
          </div>
          <div class="report-links">
            ${renderLink("morning", "🌅", "08:00")}
            ${renderLink("noon", "☀️", "11:45")}
            ${renderLink("evening", "🌙", "20:30")}
          </div>
        </div>`;
    });

    const reportCount = week.reports.filter(r => r.evening?.file || r.noon?.file || r.morning?.file).length;
    gridHTML += `
      <details ${isOpen ? 'open' : ''} style="margin-bottom:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <summary style="padding:10px 12px;font-size:14px;font-weight:600;color:var(--accent);cursor:pointer;background:rgba(88,166,255,0.04);list-style:none;display:flex;align-items:center;gap:8px;user-select:none">
          <span style="font-size:12px;transition:transform 0.2s">${isOpen ? '▼' : '▶'}</span>
          📅 ${week.label}（${week.monday}起）
          <span style="margin-left:auto;font-size:11px;color:var(--text2);font-weight:400">${reportCount}份报告</span>
        </summary>
        <div style="padding:4px 6px 6px">${weekContent}</div>
      </details>`;
  });
  document.getElementById("reportGrid").innerHTML = gridHTML;

  // 折叠箭头旋转
  document.querySelectorAll('#reportGrid details').forEach(function(det){
    det.addEventListener('toggle', function(){
      var arrow = this.querySelector('summary span:first-child');
      arrow.textContent = this.open ? '▼' : '▶';
    });
  });
}

// 回到顶部按钮
window.addEventListener("scroll", function() {
  document.getElementById("backTop").classList.toggle("show", window.scrollY > 300);
});


// 刷新提示：页面可见时检测是否需要刷新
(function(){
  var hint = document.getElementById('refreshHint');
  var lastCheck = Date.now();
  // 页面从后台恢复时显示刷新提示
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && Date.now() - lastCheck > 300000) { // 5分钟后回到页面
      hint.style.display = 'block';
      setTimeout(function(){ hint.style.display = 'none'; }, 5000);
    }
    lastCheck = Date.now();
  });
  // 顶部下拉检测（简易版）
  var startY = 0;
  document.addEventListener('touchstart', function(e){ startY = e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(window.scrollY === 0 && e.touches[0].clientY - startY > 60){
      hint.style.display = 'block';
      setTimeout(function(){ hint.style.display = 'none'; }, 3000);
    }
  }, {passive:true});
})();

// 初始化
render();
</script>

</body>
</html>
