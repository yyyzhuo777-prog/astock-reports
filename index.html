<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A股资讯">
<link rel="manifest" href="manifest.json">
<title>A股每日资讯</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text2: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d29922;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
    width: 100%;
    max-width: 1280px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }
  .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
  .header {
    text-align: center;
    padding: 20px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .subtitle { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 12px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
    flex: 0 0 auto;
  }
  @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.4} }
  .snapshot {
    background: linear-gradient(135deg, #1a2332, #161b22);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .snapshot::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--red), var(--orange), var(--green));
  }
  .snapshot-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .snapshot-date { font-size: 11px; color: var(--text2); font-weight: 400; margin-left: auto; }
  .emotion-hero {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 14px 10px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, rgba(88,166,255,.12), rgba(188,140,255,.08));
    border: 1px solid rgba(88,166,255,.25);
    border-radius: 10px;
  }
  .emotion-num {
    font-size: 42px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .emotion-num small { font-size: 16px; -webkit-text-fill-color: var(--text2); color: var(--text2); }
  .emotion-text { font-size: 15px; font-weight: 700; }
  .emotion-level {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .emotion-level.hot { background: rgba(248,81,73,.15); color: var(--red); }
  .emotion-level.neutral { background: rgba(210,153,34,.15); color: var(--orange); }
  .emotion-level.cold { background: rgba(63,185,80,.15); color: var(--green); }
  .snapshot-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .snap-item {
    text-align: center;
    padding: 8px 4px;
    background: rgba(255,255,255,.03);
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,.05);
  }
  .snap-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .snap-value { font-size: 15px; font-weight: 700; }
  .snap-up { color: var(--red); }
  .snap-down { color: var(--green); }
  .snap-neutral { color: var(--orange); }
  .snapshot-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .snap-tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(88,166,255,.1);
    color: var(--accent);
    border: 1px solid rgba(88,166,255,.2);
  }
  .snap-tag.hot { background: rgba(248,81,73,.1); color: var(--red); border-color: rgba(248,81,73,.2); }
  .snapshot-judge {
    font-size: 12px;
    color: var(--text);
    line-height: 1.6;
    padding: 8px 10px;
    margin-top: 10px;
    background: rgba(255,255,255,.03);
    border-left: 3px solid var(--orange);
    border-radius: 0 6px 6px 0;
  }
  .snapshot-judge:empty { display: none; }
  .snapshot-judge b { color: var(--orange); }
  .snapshot-link-row { margin-top: 10px; text-align: center; }
  .snapshot-link-row a {
    display: inline-block;
    padding: 7px 16px;
    background: rgba(88,166,255,.12);
    color: var(--accent);
    border: 1px solid rgba(88,166,255,.3);
    border-radius: 18px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
  }
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 10px;
    padding-left: 8px;
    border-left: 3px solid var(--accent);
  }
  .quick-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }
  .quick-scroll::-webkit-scrollbar { display: none; }
  .quick-card {
    flex: 0 0 auto;
    min-width: min(82vw, 290px);
    scroll-snap-align: start;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .quick-card.active { border-color: rgba(88,166,255,.7); background: rgba(88,166,255,.05); }
  .quick-card .qc-date { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .quick-card .qc-summary { font-size: 11px; color: var(--text2); line-height: 1.45; min-height: 32px; }
  .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
  .quick-btn {
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 7px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 11px;
    background: rgba(255,255,255,.025);
  }
  .quick-btn:hover { border-color: var(--accent); background: rgba(88,166,255,.08); }
  .quick-btn.disabled { opacity: .35; pointer-events: none; }
  .focus-list { display: flex; flex-direction: column; gap: 6px; }
  .focus-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
    padding: 6px 10px;
    background: rgba(255,255,255,.03);
    border-radius: 6px;
    border-left: 2px solid var(--accent);
  }
  .focus-item .f-num {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(88,166,255,.15);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .focus-empty { font-size: 12px; color: var(--text2); padding: 8px 4px; }
  .discipline-strip {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
    font-size: 12px;
    color: var(--text);
  }
  .discipline-strip::-webkit-scrollbar { display: none; }
  .discipline-strip span {
    flex: 0 0 auto;
    scroll-snap-align: start;
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
  }
  .month-filter {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 10px;
    scrollbar-width: none;
  }
  .month-filter::-webkit-scrollbar { display: none; }
  .month-btn {
    flex: 0 0 auto;
    min-height: 36px;
    padding: 6px 12px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    background: var(--card);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .month-btn.active { background: rgba(88,166,255,.15); color: var(--accent); border-color: var(--accent); }
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  .search-box input::placeholder { color: var(--text2); }
  .report-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .date-group { background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .date-header {
    background: rgba(88,166,255,.06);
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .date-header .weekday { font-size: 11px; color: var(--text2); font-weight: 400; }
  .report-links { display: grid; grid-template-columns: repeat(3, 1fr); }
  .report-link {
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 4px;
    text-decoration: none;
    color: var(--text);
    font-size: 12px;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .report-link:last-child { border-right: none; }
  .report-link:hover { background: rgba(88,166,255,.08); }
  .report-link.disabled { color: var(--text2); opacity: .4; pointer-events: none; }
  .report-link .time { font-size: 10px; color: var(--text2); display: block; margin-top: 1px; }
  .pending-dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: dotPulse 1.4s infinite ease-in-out;
  }
  @keyframes dotPulse { 0%,80%,100% {transform:scale(.4);opacity:.3} 40% {transform:scale(1);opacity:1} }
  .footer {
    text-align: center;
    padding: 16px 0;
    font-size: 11px;
    color: var(--text2);
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }
  .footer .schedule-inline { margin-bottom: 6px; color: var(--text); }
  .back-top {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    right: max(16px, env(safe-area-inset-right));
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 18px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    z-index: 100;
  }
  .back-top.show { opacity: 1; }
  @media (max-width: 420px) {
    body { padding: 12px; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    .header { padding-top: 14px; }
    .emotion-hero { justify-content: flex-start; padding-left: 14px; }
    .emotion-num { font-size: 38px; }
    .snapshot { padding: 14px; }
    .snapshot-grid { gap: 6px; }
    .snap-value { font-size: 14px; }
    .quick-card { min-width: min(86vw, 270px); }
    .status-bar { gap: 6px; padding: 8px 10px; }
    .footer { padding-left: 4px; padding-right: 4px; }
  }

  @media (min-width: 720px) {
    body { padding: 20px; padding-bottom: 88px; }
    .header h1 { font-size: 24px; }
    .snapshot { padding: 18px; }
    .emotion-num { font-size: 46px; }
    .snap-item { padding: 10px 6px; }
  }

  @media (min-width: 960px) {
    body { padding: 24px 28px 96px; }
    .header { padding-top: 14px; margin-bottom: 14px; }
    .header h1 { font-size: 26px; }
    .status-bar { margin-bottom: 16px; }
    .dashboard-grid {
      grid-template-columns: minmax(0, 1.45fr) minmax(340px, .75fr);
      column-gap: 20px;
      row-gap: 14px;
      align-items: start;
    }
    .snapshot { grid-column: 1; grid-row: 1 / span 3; margin-bottom: 0; }
    .recent-section { grid-column: 2; grid-row: 1; margin-bottom: 0; }
    .focus-section { grid-column: 2; grid-row: 2; margin-bottom: 0; }
    .quotes-section { grid-column: 2; grid-row: 3; margin-bottom: 0; }
    .history-section { grid-column: 1 / -1; margin-top: 4px; }
    .quick-scroll { flex-direction: column; overflow: visible; padding-bottom: 0; scroll-snap-type: none; }
    .quick-card { width: 100%; min-width: 0; }
    .discipline-strip { flex-wrap: wrap; overflow: visible; padding-bottom: 0; scroll-snap-type: none; }
    .week-days { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 8px; }
    .week-days .date-group { margin: 0 !important; }
    .footer { margin-top: 26px; }
  }

  @media (max-width: 640px) {
    .status-bar { flex-wrap: wrap; }
    .status-bar > span:last-child { width: 100%; margin-left: 16px !important; }
    .snapshot-judge { font-size: 13px; }
    .snapshot-link-row a { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; }
  }

  @media (max-width: 350px) {
    .snapshot-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (min-width: 1200px) {
    body { padding-left: 32px; padding-right: 32px; }
    .dashboard-grid { grid-template-columns: minmax(0, 1.6fr) minmax(360px, .8fr); column-gap: 24px; }
    .snapshot { padding: 22px; }
    .emotion-hero { min-height: 112px; }
    .emotion-num { font-size: 50px; }
    .snapshot-grid { gap: 10px; }
    .snap-item { padding: 12px 8px; }
    .snap-label { font-size: 12px; }
    .snap-value { font-size: 16px; }
    .week-days { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

</style>
</head>
<body>
<div class="header">
  <h1>📊 A股每日资讯</h1>
  <div class="subtitle"><span id="dataAsOf">短线复盘 · 盘前/午盘/盘后 · 自动更新</span></div>
</div>

<div class="status-bar">
  <div class="status-dot"></div>
  <span>系统正常</span>
  <span style="margin-left:auto">🕐 <span id="nextReport">计算中...</span></span>
</div>

<div id="refreshHint" style="display:none;text-align:center;padding:8px;margin-bottom:12px;background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.2);border-radius:6px;font-size:12px;color:var(--accent)">
  🔄 下拉刷新获取最新报告
</div>

<main class="dashboard-grid">
<div class="snapshot" id="snapshotArea">
  <div class="snapshot-title">
    ⚡ 最新速览
    <span class="snapshot-date" id="snapshotDate"></span>
  </div>
  <div class="emotion-hero" id="emotionHero"></div>
  <div class="snapshot-grid" id="snapshotGrid"></div>
  <div class="snapshot-tags" id="snapshotTags"></div>
  <div class="snapshot-judge" id="snapshotJudge"></div>
  <div class="snapshot-link-row" id="snapshotLinkRow"></div>
</div>

<div class="section recent-section">
  <div class="section-title">📋 最近报告</div>
  <div class="quick-scroll" id="quickScroll"></div>
</div>

<div class="section focus-section">
  <div class="section-title" id="focusTitle">🎯 下一交易日关注</div>
  <div class="focus-list" id="focusList"><div class="focus-empty">等待报告生成</div></div>
</div>

<div class="section quotes-section">
  <div class="section-title">⚡ 短线交易语录</div>
  <div class="discipline-strip" id="disciplineStrip"></div>
</div>

<div class="section history-section">
  <div class="section-title">📅 历史报告</div>
  <div class="month-filter" id="monthFilter"></div>
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="reportSearch" placeholder="搜索日期、主线、板块...">
  </div>
  <div class="report-grid" id="reportGrid"></div>
</div>
</main>

<div class="footer">
  <div class="schedule-inline">自动报告 · 08:15 盘前 · 12:00 午盘 · 20:45 盘后</div>
  A股每日资讯 · AI 自动生成 · 仅供参考，不构成投资建议<br>
  <span id="footerTime">页面更新中...</span><br>
  💡 iPhone Safari: 点“分享”→“添加到主屏幕”获得 App 体验
</div>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ============================================================
// 报告数据配置
// 规则：日期只存 YYYY-MM-DD；星期由程序算；情绪只存数字；仓位只存数字。
// ============================================================
const DEFAULT_REPORT_CONFIG = {
  lastUpdated: "2026-08-23",
  schedule: [
    { key: "morning", time: "08:15", min: 8 * 60 + 15, label: "盘前", icon: "🌅" },
    { key: "noon", time: "12:00", min: 12 * 60, label: "午盘", icon: "☀️" },
    { key: "evening", time: "20:45", min: 20 * 60 + 45, label: "盘后", icon: "🌙" }
  ],
  delayGraceMinutes: 30,
  reports: [
    {
      date: "2026-08-24",
      morning: null,
      noon: null,
      evening: null
    },
    {
      date: "2026-08-21",
      morning: {
        file: "report-0821-morning.html",
        time: "08:00",
        summary: "美联储鹰派 · Moderna映射 · 沪八条+央行投放"
      },
      noon: {
        file: "report-0821-noon.html",
        time: "12:00",
        summary: "半日1.25万亿 · 47涨停 · 贵金属+锂矿领涨"
      },
      evening: {
        file: "report-0821-v2.html",
        time: "20:30",
        summary: "情绪48 · 涨停54 · 主线：CPO+贵金属 · 二线弹性标的",
        judge: "情绪修复但赚钱效应分化，资金高度集中在CPO/贵金属两条主线，追高性价比一般，关注核心方向持续性。",
        maxPosition: 30,
        focusTargetDate: "2026-08-24",
        focus: [
          "CPO/通信前排反馈，是否延续净流入",
          "贵金属消化获利盘后的持续性",
          "机器人/固态电池能否回流形成二线机会"
        ],
        snap: {
          shIndex: { value: "3905", change: "+0.04%", up: true },
          cyIndex: { value: "3546", change: "+1.43%", up: true },
          volume: "1.88万亿",
          limitUp: "54",
          limitDown: "14",
          emotion: 48,
          sealRate: "75%",
          tags: [
            { text: "🔥 CPO/通信", hot: true },
            { text: "🔥 贵金属", hot: true },
            { text: "💎 锂矿", hot: false },
            { text: "🤖 机器人", hot: false },
            { text: "🔋 固态电池", hot: false }
          ]
        }
      }
    }
  ]
};

// ============================================================
// 数据加载：优先读取同目录 reports-data.json；失败时回退到内置配置。
// 日常自动化只需更新 reports-data.json，导航页无需每天改 HTML。
// ============================================================
let REPORT_CONFIG = JSON.parse(JSON.stringify(DEFAULT_REPORT_CONFIG));
const REPORT_DATA_URL = "reports-data.json";
const AUTO_REFRESH_MS = 2 * 60 * 1000;

function isValidReportConfig(cfg) {
  return !!(cfg && Array.isArray(cfg.reports) && Array.isArray(cfg.schedule));
}

async function refreshReportConfig(silent = false) {
  try {
    const res = await fetch(`${REPORT_DATA_URL}?v=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const cfg = await res.json();
    if (!isValidReportConfig(cfg)) throw new Error("invalid report config");
    REPORT_CONFIG = cfg;
    if (!silent) render();
    return true;
  } catch (err) {
    if (!silent) render();
    console.warn("reports-data.json 加载失败，已使用内置配置：", err);
    return false;
  }
}

// ============================================================
// 时间 / 日期工具：统一按中国市场时区 Asia/Shanghai
// ============================================================
const MARKET_TZ = "Asia/Shanghai";
const WEEKDAYS = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

function pad2(n) { return String(n).padStart(2, "0"); }

function parseYMD(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return { y, m, d };
}

function utcDateFromYMD(dateStr) {
  const { y, m, d } = parseYMD(dateStr);
  return new Date(Date.UTC(y, m - 1, d));
}

function formatYMDUTC(date) {
  return `${date.getUTCFullYear()}-${pad2(date.getUTCMonth() + 1)}-${pad2(date.getUTCDate())}`;
}

function getWeekday(dateStr) {
  return WEEKDAYS[utcDateFromYMD(dateStr).getUTCDay()];
}

function formatDateShort(dateStr) {
  const { m, d } = parseYMD(dateStr);
  return `${m}/${d}`;
}

function getChinaNow() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: MARKET_TZ,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date());
  const obj = {};
  parts.forEach(p => { if (p.type !== "literal") obj[p.type] = p.value; });
  return {
    dateStr: `${obj.year}-${obj.month}-${obj.day}`,
    hour: Number(obj.hour),
    minute: Number(obj.minute),
    nowMin: Number(obj.hour) * 60 + Number(obj.minute)
  };
}

function parseClockToMinutes(clock) {
  if (!clock || !/^\d{1,2}:\d{2}$/.test(clock)) return null;
  const [h, m] = clock.split(":").map(Number);
  return h * 60 + m;
}

function isSessionPublished(reportDate, sessionKey, data) {
  if (!data || !data.file) return false;
  const now = getChinaNow();
  if (reportDate < now.dateStr) return true;
  if (reportDate > now.dateStr) return false;
  const actualMin = parseClockToMinutes(data.time);
  if (actualMin !== null) return actualMin <= now.nowMin;
  const scheduled = REPORT_CONFIG.schedule.find(s => s.key === sessionKey);
  return !scheduled || scheduled.min <= now.nowMin;
}

function isFuture(dateStr) { return dateStr > getChinaNow().dateStr; }
function isToday(dateStr) { return dateStr === getChinaNow().dateStr; }

function getMondayKey(dateStr) {
  const d = utcDateFromYMD(dateStr);
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() - day + 1);
  return formatYMDUTC(d);
}

function getISOWeekInfo(dateStr) {
  const d = utcDateFromYMD(dateStr);
  d.setUTCHours(0, 0, 0, 0);
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const isoYear = d.getUTCFullYear();
  const yearStart = new Date(Date.UTC(isoYear, 0, 1));
  const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return { year: isoYear, week };
}

function getNextConfiguredTradingDate(afterDate) {
  return REPORT_CONFIG.reports
    .map(r => r.date)
    .filter(d => d > afterDate)
    .sort()[0] || null;
}

// ============================================================
// 数据查找
// ============================================================
function findLatestSnapshot() {
  const sessions = ["evening", "noon", "morning"];
  const today = getChinaNow().dateStr;
  const dated = REPORT_CONFIG.reports
    .filter(r => r.date <= today)
    .sort((a, b) => b.date.localeCompare(a.date));
  for (const r of dated) {
    for (const k of sessions) {
      const data = r[k];
      if (data && data.snap && isSessionPublished(r.date, k, data)) {
        return { report: r, sessionKey: k, snap: data.snap, data };
      }
    }
  }
  return null;
}

function findLatestFocus() {
  const sessions = ["evening", "noon", "morning"];
  const today = getChinaNow().dateStr;
  const dated = REPORT_CONFIG.reports
    .filter(r => r.date <= today)
    .sort((a, b) => b.date.localeCompare(a.date));
  for (const r of dated) {
    for (const k of sessions) {
      const data = r[k];
      if (data && Array.isArray(data.focus) && data.focus.length && isSessionPublished(r.date, k, data)) {
        return { report: r, sessionKey: k, data };
      }
    }
  }
  return null;
}

// ============================================================
// 渲染
// ============================================================
let currentMonthFilter = "all";
let currentSearchQuery = "";

function render() {
  document.getElementById("footerTime").textContent = "页面更新：" + (REPORT_CONFIG.lastUpdated || "--");
  renderDataAsOf();
  renderNextReport();
  renderSnapshot();
  renderQuickScroll();
  renderFocus();
  renderDiscipline();
  renderMonthFilter();
  renderReportGrid();
}

function renderDataAsOf() {
  const el = document.getElementById("dataAsOf");
  const chosen = findLatestSnapshot();
  if (!chosen) {
    el.textContent = "等待首份报告生成";
    return;
  }
  const label = { morning: "盘前", noon: "午盘", evening: "盘后" }[chosen.sessionKey];
  const timeText = chosen.data.time ? ` · 截至 ${chosen.data.time}` : "";
  el.textContent = `${formatDateShort(chosen.report.date)} ${getWeekday(chosen.report.date)} · ${label}数据${timeText}`;
}

function renderNextReport() {
  const el = document.getElementById("nextReport");
  const now = getChinaNow();
  const cur = REPORT_CONFIG.reports.find(r => r.date === now.dateStr);

  if (cur) {
    for (const s of REPORT_CONFIG.schedule) {
      if (cur[s.key] && cur[s.key].file) continue;

      if (now.nowMin < s.min) {
        el.textContent = `下次报告 ${s.time} ${s.label}`;
        return;
      }
      if (now.nowMin < s.min + REPORT_CONFIG.delayGraceMinutes) {
        el.textContent = `${s.label}报告生成中`;
        return;
      }
      el.textContent = `⚠️ ${s.label}报告延迟`;
      return;
    }
    el.textContent = "今日报告已全部更新";
    return;
  }

  const future = REPORT_CONFIG.reports
    .filter(r => r.date > now.dateStr)
    .sort((a, b) => a.date.localeCompare(b.date))[0];

  if (future) {
    el.textContent = `下次报告 ${formatDateShort(future.date)} ${getWeekday(future.date)} 08:15 盘前`;
  } else {
    el.textContent = "暂无后续报告安排";
  }
}

function renderSnapshot() {
  const chosen = findLatestSnapshot();
  if (!chosen) {
    document.getElementById("snapshotDate").textContent = "暂无数据";
    document.getElementById("emotionHero").innerHTML = "";
    document.getElementById("snapshotGrid").innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text2);font-size:13px;padding:8px 0">等待报告生成</div>';
    document.getElementById("snapshotTags").innerHTML = "";
    document.getElementById("snapshotJudge").innerHTML = "";
    document.getElementById("snapshotLinkRow").innerHTML = "";
    return;
  }

  const sessionLabel = { morning: "盘前", noon: "午盘", evening: "盘后" };
  const d = chosen.snap;
  const emotionNum = Number(d.emotion) || 0;
  const maxPosition = Number(chosen.data.maxPosition ?? d.maxPosition ?? 0);

  let emoLevel = "neutral", emoDesc = "中性";
  if (emotionNum >= 65) { emoLevel = "hot"; emoDesc = "偏热"; }
  else if (emotionNum < 40) { emoLevel = "cold"; emoDesc = "偏冷"; }

  document.getElementById("snapshotDate").textContent =
    `${formatDateShort(chosen.report.date)} ${getWeekday(chosen.report.date)} ${sessionLabel[chosen.sessionKey]}`;

  document.getElementById("emotionHero").innerHTML = `
    <div class="emotion-num">${emotionNum}<small>/100</small></div>
    <div class="emotion-text">情绪温度
      <div><span class="emotion-level ${emoLevel}">${emoDesc}</span></div>
    </div>`;

  document.getElementById("snapshotGrid").innerHTML = `
    <div class="snap-item">
      <div class="snap-label">涨停/跌停</div>
      <div class="snap-value"><span class="snap-up">${d.limitUp ?? "--"}</span> / <span class="snap-down">${d.limitDown ?? "--"}</span></div>
    </div>
    <div class="snap-item">
      <div class="snap-label">封板率</div>
      <div class="snap-value snap-neutral">${d.sealRate ?? "--"}</div>
    </div>
    <div class="snap-item">
      <div class="snap-label">成交</div>
      <div class="snap-value snap-neutral">${d.volume ?? "--"}</div>
    </div>
    <div class="snap-item">
      <div class="snap-label">上证</div>
      <div class="snap-value ${d.shIndex?.up ? 'snap-up' : 'snap-down'}">${d.shIndex?.value ?? "--"} <small>${d.shIndex?.change ?? ""}</small></div>
    </div>
    <div class="snap-item">
      <div class="snap-label">创业板</div>
      <div class="snap-value ${d.cyIndex?.up ? 'snap-up' : 'snap-down'}">${d.cyIndex?.value ?? "--"} <small>${d.cyIndex?.change ?? ""}</small></div>
    </div>
    <div class="snap-item">
      <div class="snap-label">仓位上限</div>
      <div class="snap-value snap-neutral">${maxPosition ? maxPosition + "%" : "--"}</div>
    </div>`;

  document.getElementById("snapshotTags").innerHTML = (d.tags || []).map(t =>
    `<span class="snap-tag${t.hot ? ' hot' : ''}">${t.text}</span>`
  ).join("");

  document.getElementById("snapshotJudge").innerHTML = chosen.data.judge
    ? `<b>市场判断：</b>${chosen.data.judge}`
    : "";

  document.getElementById("snapshotLinkRow").innerHTML = chosen.data.file
    ? `<a href="${chosen.data.file}">查看${sessionLabel[chosen.sessionKey]}完整报告 →</a>`
    : "";
}

function renderQuickScroll() {
  const recentReports = REPORT_CONFIG.reports
    .filter(r => r.morning?.file || r.noon?.file || r.evening?.file)
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 3);

  const buttons = [
    { key: "morning", label: "🌅 盘前" },
    { key: "noon", label: "☀️ 午盘" },
    { key: "evening", label: "🌙 盘后" }
  ];

  document.getElementById("quickScroll").innerHTML = recentReports.map(r => {
    const latest = r.evening || r.noon || r.morning;
    const actions = buttons.map(b => {
      const item = r[b.key];
      return item?.file
        ? `<a class="quick-btn" href="${item.file}">${b.label}</a>`
        : `<span class="quick-btn disabled">${b.label}</span>`;
    }).join("");

    return `
      <div class="quick-card active">
        <div class="qc-date">${formatDateShort(r.date)} ${getWeekday(r.date)}</div>
        <div class="qc-summary">${latest?.summary || ""}</div>
        <div class="quick-actions">${actions}</div>
      </div>`;
  }).join("");
}

function renderFocus() {
  const title = document.getElementById("focusTitle");
  const area = document.getElementById("focusList");
  const chosen = findLatestFocus();

  if (!chosen) {
    title.textContent = "🎯 下一交易日关注";
    area.innerHTML = '<div class="focus-empty">等待报告生成</div>';
    return;
  }

  const targetDate = chosen.data.focusTargetDate || getNextConfiguredTradingDate(chosen.report.date);
  title.textContent = targetDate
    ? `🎯 ${formatDateShort(targetDate)} ${getWeekday(targetDate)}关注`
    : "🎯 下一交易日关注";

  area.innerHTML = chosen.data.focus.map((f, i) =>
    `<div class="focus-item"><span class="f-num">${i + 1}</span><span>${f}</span></div>`
  ).join("");
}

function renderDiscipline() {
  const quotes = [
    "只做最强，不做跟风",
    "买在分歧，卖在一致",
    "看不懂就空仓，做错就止损",
    "宁可错过，不可做错",
    "计划交易，交易计划"
  ];
  const area = document.getElementById("disciplineStrip");
  if (!area) return;
  area.innerHTML = quotes.map(q => `<span>${q}</span>`).join("");
}

function renderMonthFilter() {
  const months = new Set(REPORT_CONFIG.reports.map(r => Number(r.date.split("-")[1])));
  const sorted = [...months].sort((a, b) => b - a);

  let html = `<button type="button" class="month-btn ${currentMonthFilter === 'all' ? 'active' : ''}" data-month="all">全部</button>`;
  sorted.forEach(m => {
    html += `<button type="button" class="month-btn ${currentMonthFilter == m ? 'active' : ''}" data-month="${m}">${m}月</button>`;
  });
  document.getElementById("monthFilter").innerHTML = html;

  document.querySelectorAll(".month-btn").forEach(btn => {
    btn.addEventListener("click", function () {
      currentMonthFilter = this.dataset.month === "all" ? "all" : Number(this.dataset.month);
      renderMonthFilter();
      renderReportGrid();
    });
  });
}

function renderReportGrid() {
  let reports = [...REPORT_CONFIG.reports].sort((a, b) => b.date.localeCompare(a.date));

  if (currentMonthFilter !== "all") {
    reports = reports.filter(r => Number(r.date.split("-")[1]) === currentMonthFilter);
  }

  if (currentSearchQuery) {
    const q = currentSearchQuery.toLowerCase();
    reports = reports.filter(r => {
      const haystack = [
        r.date,
        formatDateShort(r.date),
        getWeekday(r.date),
        r.morning?.summary,
        r.noon?.summary,
        r.evening?.summary
      ].filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(q);
    });
  }

  if (!reports.length) {
    document.getElementById("reportGrid").innerHTML = '<div style="text-align:center;padding:20px;color:var(--text2);font-size:13px">没有找到匹配的报告</div>';
    return;
  }

  const weeks = new Map();
  reports.forEach(r => {
    const mondayKey = getMondayKey(r.date);
    if (!weeks.has(mondayKey)) {
      const iso = getISOWeekInfo(r.date);
      weeks.set(mondayKey, {
        key: mondayKey,
        label: `${iso.year} 第${iso.week}周`,
        monday: formatDateShort(mondayKey),
        reports: []
      });
    }
    weeks.get(mondayKey).reports.push(r);
  });

  const weekList = [...weeks.values()].sort((a, b) => b.key.localeCompare(a.key));
  let gridHTML = "";

  weekList.forEach((week, idx) => {
    const isOpen = idx === 0;
    let weekContent = "";

    week.reports.sort((a, b) => b.date.localeCompare(a.date)).forEach(r => {
      const future = isFuture(r.date);
      const today = isToday(r.date);
      let dateLabel = r.date.slice(5);
      if (today) dateLabel += " (今天)";

      const renderLink = (session, icon, defaultTime) => {
        const data = r[session];
        if (data?.file) {
          return `<a class="report-link" href="${data.file}" target="_blank" rel="noopener">
            <div>${icon}<div class="time">${data.time || defaultTime}</div></div>
          </a>`;
        }
        if (future) {
          return `<span class="report-link disabled"><div>${icon}<div class="time"><span class="pending-dot"></span></div></div></span>`;
        }
        return `<span class="report-link disabled"><div>${icon}<div class="time">—</div></div></span>`;
      };

      weekContent += `
        <div class="date-group" style="margin:4px 0">
          <div class="date-header">📅 ${dateLabel} <span class="weekday">${getWeekday(r.date)}</span></div>
          <div class="report-links">
            ${renderLink("morning", "🌅", "08:15")}
            ${renderLink("noon", "☀️", "12:00")}
            ${renderLink("evening", "🌙", "20:45")}
          </div>
        </div>`;
    });

    const reportCount = week.reports.reduce((sum, r) =>
      sum + [r.morning?.file, r.noon?.file, r.evening?.file].filter(Boolean).length, 0
    );

    gridHTML += `
      <details ${isOpen ? "open" : ""} style="margin-bottom:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <summary style="padding:10px 12px;font-size:14px;font-weight:600;color:var(--accent);cursor:pointer;background:rgba(88,166,255,.04);list-style:none;display:flex;align-items:center;gap:8px;user-select:none">
          <span class="week-arrow" style="font-size:12px">${isOpen ? "▼" : "▶"}</span>
          📅 ${week.label}（${week.monday}起）
          <span style="margin-left:auto;font-size:11px;color:var(--text2);font-weight:400">${reportCount}份报告</span>
        </summary>
        <div class="week-days">${weekContent}</div>
      </details>`;
  });

  document.getElementById("reportGrid").innerHTML = gridHTML;
  document.querySelectorAll("#reportGrid details").forEach(det => {
    det.addEventListener("toggle", function () {
      const arrow = this.querySelector(".week-arrow");
      if (arrow) arrow.textContent = this.open ? "▼" : "▶";
    });
  });
}

// ============================================================
// 交互
// ============================================================
document.getElementById("reportSearch").addEventListener("input", function () {
  currentSearchQuery = this.value.trim();
  renderReportGrid();
});

window.addEventListener("scroll", function () {
  document.getElementById("backTop").classList.toggle("show", window.scrollY > 300);
});

(function () {
  const hint = document.getElementById("refreshHint");
  let lastCheck = Date.now();

  async function refreshLatest(showHint = false) {
    const ok = await refreshReportConfig(true);
    render();
    if (showHint) {
      hint.style.display = "block";
      hint.textContent = ok ? "✅ 已获取最新报告数据" : "⚠️ 暂未获取到新数据，已保留当前内容";
      setTimeout(() => { hint.style.display = "none"; }, 3000);
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && Date.now() - lastCheck > 120000) refreshLatest(false);
    lastCheck = Date.now();
  });

  let startY = 0;
  let pullTriggered = false;
  document.addEventListener("touchstart", e => { startY = e.touches[0].clientY; pullTriggered = false; }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!pullTriggered && window.scrollY === 0 && e.touches[0].clientY - startY > 90) {
      pullTriggered = true;
      refreshLatest(true);
    }
  }, { passive: true });

  setInterval(() => refreshLatest(false), AUTO_REFRESH_MS);
})();

async function initDashboard() {
  await refreshReportConfig(true);
  render();
}

initDashboard();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function (registration) {
      registration.update().catch(function () {});
    }).catch(function () {});
  });
}
